# gitleaks reads this from the repository root, in CI's secret scan (.github/workflows/ci.yml).
# It keeps every default rule, and allows only what's listed here.

[extend]
useDefault = true

# refmap's data manifest, generated by `panther-engine refmap data manifest`, maps each data file's
# path to its sha256. Two paths end in organism codes that start with API (APICC, APIME), so the
# generic-api-key rule reads the checksum beside them as a key. Allowed only for that rule, in that
# file, and only for a value that is a sha256: anything else there is still reported.
[[allowlists]]
description = "sha256 checksums in refmap's data manifest"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^engine/src/panther_engine/refmap/data\.json$''']
regexTarget = "secret"
regexes = ['''^[0-9a-f]{64}$''']
