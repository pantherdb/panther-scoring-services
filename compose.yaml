# The engine's checks and CLI, the API, and the site, in images with the pinned tools, on any machine with
# Docker. From the repository root:
#
#   docker compose run --rm engine                          # lint, format, types and tests
#   docker compose run --rm engine uv run pytest -k name    # one test
#   docker compose run --rm engine panther-engine tools     # the CLI
#   docker compose up --build api                           # the API on localhost:8000
#   docker compose up --build web                           # the site and the API on localhost:8080
#
# See docs/testing/engine.md, docs/testing/api.md and docs/testing/frontend.md.

services:
  engine:
    build:
      context: .
      target: engine
    # The working copy replaces the copy the image installed from, at the same path, so the
    # editable install in /opt/venv imports it. The developer's data folder, .data/, is mounted
    # read-only: fetch the cSNP data sample into it first (docs/testing/engine.md).
    volumes:
      - ./engine:/work/engine
      - ./.data:/data:ro
    environment:
      PANTHER_DATA_DIR: /data
      # The environment stays in the image and never touches engine/.venv. An out-of-date
      # uv.lock stops the run instead of being rewritten.
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_LOCKED: "1"
      # Nothing is written into the mount: on a Linux host, files the container's user writes
      # there belong to that user, and the developer couldn't delete them.
      PYTHONDONTWRITEBYTECODE: "1"
      RUFF_CACHE_DIR: /tmp/ruff-cache
      PYTEST_ADDOPTS: -p no:cacheprovider
    command:
      - sh
      - -c
      - uv run ruff check && uv run ruff format --check && uv run basedpyright && uv run pytest

  # The API, as the image serves it, for the frontend's dev proxy to call. No mount and no reload:
  # rebuild with --build after a change. Develop the API natively (docs/testing/api.md). Name the
  # service when starting it, or `docker compose up` also runs the engine's checks. Its csnp jobs
  # read the data folder as the engine service does: fetch the cSNP data sample into .data/ first
  # (docs/testing/api.md). Without it, every csnp job fails with the generic error.
  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    volumes:
      - ./.data:/data:ro
    environment:
      PANTHER_DATA_DIR: /data

  # The site as a server serves it: the production build, by nginx on port 8080, with /api/ sent to
  # the api service, which starts first. Rebuild with --build after a change. To work on the
  # frontend, use its dev server instead (docs/testing/frontend.md).
  web:
    build:
      context: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - api
